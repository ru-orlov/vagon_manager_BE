spring.application.name=wagonmanager
server.port=8090
# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/wagon_manager
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# JPA properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Liquibase config
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:liquibase/changelog-root.xml
spring.liquibase.default-schema=public

# (Optional) Hibernate dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
